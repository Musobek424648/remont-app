<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remont Xarajatlari</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f4f4f9; }
        .container { max-width: 600px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1); }
        h2, h3, h4 { color: #333; }
        input, button { padding: 10px; margin: 5px 0; width: 100%; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; border-radius: 4px; }
        button:hover { background-color: #218838; }
        .btn-blue { background-color: #007bff; }
        .btn-blue:hover { background-color: #0069d9; }
        .item { padding: 10px; border-bottom: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; }
        .box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 5px; }
        .total-box { margin-top: 10px; padding: 10px; background: #e9ecef; border-radius: 4px; text-align: right; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏗️ Remont Xarajatlari</h2>

    <!-- Ob'ekt qo'shish -->
    <div class="box">
        <h3>Yangi Ob'ekt Qo'shish</h3>
        <input type="text" id="objInput" placeholder="Ob'ekt nomi (masalan: Yunusobod)">
        <button class="btn-blue" onclick="addObj()">Ob'ektni Saqlash</button>
    </div>

    <!-- Ob'ektlar ro'yxati -->
    <div class="box">
        <h3>Ob'ektlar Ro'yxati</h3>
        <div id="objList">Yuklanmoqda...</div>
    </div>

    <!-- Xarajat qo'shish va ko'rish oynasi -->
    <div id="expenseBox" class="box" style="display:none;">
        <h3 id="selectedObjTitle" style="color: #007bff;"></h3>
        
        <div style="background: #f8f9fa; padding: 10px; border-radius: 5px; margin-bottom: 15px;">
            <h4>Yangi xarajat kiritish:</h4>
            <input type="text" id="expName" placeholder="Xarajat nomi (masalan: Sement)">
            <input type="number" id="expSum" placeholder="Summa (so'm)">
            <button onclick="addExp()">+ Xarajatni Saqlash</button>
        </div>

        <h4>Kiritilgan xarajatlar ro'yxati:</h4>
        <div id="expList"></div>
        <div id="totalSum" class="total-box">Jami: 0 so'm</div>
    </div>

    <!-- Excel yuklash -->
    <div class="box" style="text-align: center;">
        <a href="/download/excel" style="text-decoration: none;">
            <button class="btn-blue">📥 Excel Hisobotni Yuklab Olish</button>
        </a>
    </div>
</div>

<script>
    let currentObj = "";

    window.onload = loadObjs;

    function loadObjs() {
        fetch('/api/objects')
            .then(r => r.json())
            .then(data => {
                let div = document.getElementById('objList');
                div.innerHTML = "";
                if(!data || data.length === 0) {
                    div.innerHTML = "<p>Hali ob'ektlar qo'shilmadi.</p>";
                    return;
                }
                data.forEach(item => {
                    let name = item.nomi;
                    let btn = document.createElement('button');
                    btn.innerText = "Xarajatlar";
                    btn.onclick = function() { selectObj(name); };
                    
                    let d = document.createElement('div');
                    d.className = 'item';
                    d.innerHTML = `<span><b>${name}</b></span>`;
                    d.appendChild(btn);
                    div.appendChild(d);
                });
            })
            .catch(e => alert("Ob'ektlarni yuklashda xato: " + e));
    }

    function addObj() {
        let nameInput = document.getElementById('objInput');
        let name = nameInput.value.trim();
        if(!name) return alert("Nom kiriting!");
        
        fetch('/api/objects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nomi: name})
        })
        .then(r => r.json())
        .then(data => {
            nameInput.value = "";
            loadObjs();
        });
    }

    function selectObj(name) {
        currentObj = name;
        document.getElementById('selectedObjTitle').innerText = "Ob'ekt: " + name;
        document.getElementById('expenseBox').style.display = "block";
        loadExp();
    }

    function loadExp() {
        if (!currentObj) return;
        fetch('/api/expenses_by_param?obekt=' + encodeURIComponent(currentObj))
            .then(r => r.json())
            .then(data => {
                let div = document.getElementById('expList');
                let totalDiv = document.getElementById('totalSum');
                div.innerHTML = "";
                let total = 0;

                if(!data || data.length === 0) {
                    div.innerHTML = "<p style='color: #777;'>Hali ushbu ob'ektga xarajat kiritilmadi.</p>";
                    totalDiv.innerText = "Jami: 0 so'm";
                    return;
                }

                data.forEach(item => {
                    let sumVal = parseInt(item.summa) || 0;
                    total += sumVal;
                    div.innerHTML += `<div class="item">
                        <span>${item.nomi}</span> 
                        <b>${sumVal} so'm</b>
                    </div>`;
                });

                totalDiv.innerText = "Jami: " + total + " so'm";
            })
            .catch(e => alert("Xarajatlarni ko'rsatishda xato: " + e));
    }

    function addExp() {
        let nameInput = document.getElementById('expName');
        let sumInput = document.getElementById('expSum');
        let name = nameInput.value.trim();
        let sum = sumInput.value.trim();

        if(!name || !sum) return alert("Xarajat nomi va summasini kiriting!");

        fetch('/api/expenses', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({obekt: currentObj, nomi: name, summa: sum})
        })
        .then(r => r.json())
        .then(data => {
            nameInput.value = "";
            sumInput.value = "";
            loadExp();
        });
    }
</script>

</body>
</html>
