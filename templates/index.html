<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ta'mirlash Xarajatlari</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            margin: 20px;
            background: #f4f6f9;
        }
        .container {
            max-width: 800px;
            margin: auto;
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        h1, h2 { color: #333; }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            margin-top: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #28a745;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
            margin-top: 10px;
        }
        button:hover { background-color: #218838; }
        .btn-edit {
            background-color: #ffc107;
            color: #212529;
            width: auto;
            padding: 5px 10px;
            font-size: 12px;
            margin-left: 10px;
            display: inline-block;
        }
        .btn-edit:hover { background-color: #e0a800; }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: left;
        }
        th { background-color: #f8f9fa; }
        .total-box {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #007bff;
        }
        li {
            margin-bottom: 8px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Ta'mirlash Xarajatlari Hisobi</h1>

        <!-- 1. Yangi obyekt qo'shish -->
        <h2>1. Yangi Obyekt Yaratish</h2>
        <div class="form-group">
            <input type="text" id="newObjectInput" placeholder="Obyekt nomi (masalan: Oshxona)">
            <button onclick="addObject()">Obyekt Qo'shish</button>
        </div>

        <!-- Obyektlar ro'yxati -->
        <h3>Mavjud Obyektlar:</h3>
        <ul id="objectsList"></ul>

        <hr>

        <!-- 2. Xarajat kiritish -->
        <h2>2. Xarajat Kiritish</h2>
        <div class="form-group">
            <label>Obyektni tanlang:</label>
            <select id="objectSelect" onchange="loadExpenses()"></select>
        </div>
        <div class="form-group">
            <label>Xarajat nomi:</label>
            <input type="text" id="expenseName" placeholder="Masalan: Kafel">
        </div>
        <div class="form-group">
            <label>Summa (so'm):</label>
            <input type="number" id="expenseAmount" placeholder="Masalan: 500000">
        </div>
        <button onclick="addExpense()">Xarajatni Saqlash</button>

        <hr>

        <!-- 3. Xarajatlar ro'yxati -->
        <h2>3. Obyekt Xarajatlari</h2>
        <table>
            <thead>
                <tr>
                    <th>Xarajat Nomi</th>
                    <th>Summa (so'm)</th>
                </tr>
            </thead>
            <tbody id="expensesTableBody"></tbody>
        </table>

        <div class="total-box" id="totalAmount">Jami: 0 so'm</div>
    </div>

    <script>
        // Sahifa yuklanganda obyektlarni olish
        document.addEventListener('DOMContentLoaded', () => {
            loadObjects();
        });

        // Obyektlarni bazadan yuklash
        async function loadObjects() {
            try {
                const res = await fetch('/api/objects');
                const objects = await res.json();
                
                const select = document.getElementById('objectSelect');
                const list = document.getElementById('objectsList');
                
                select.innerHTML = '<option value="">-- Obyektni tanlang --</option>';
                list.innerHTML = '';

                objects.forEach(obj => {
                    // Dropdown tanloviga qo'shish
                    const option = document.createElement('option');
                    option.value = obj.nomi;
                    option.textContent = obj.nomi;
                    select.appendChild(option);

                    // Ro'yxatga qo'shish va Tahrirlash tugmasini joylash
                    const li = document.createElement('li');
                    li.innerHTML = `
                        <b>${obj.nomi}</b>
                        <button class="btn-edit" onclick="editObject('${obj.nomi}')">✏️ Nomini o'zgartirish</button>
                    `;
                    list.appendChild(li);
                });
            } catch (err) {
                console.error("Obyektlarni yuklashda xatolik:", err);
            }
        }

        // Yangi obyekt qo'shish
        async function addObject() {
            const input = document.getElementById('newObjectInput');
            const nomi = input.value.trim();
            if (!nomi) return alert("Obyekt nomini kiriting!");

            await fetch('/api/objects', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ nomi: nomi })
            });

            input.value = '';
            loadObjects();
        }

        // Obyekt nomini tahrirlash (O'zgartirish)
        async function editObject(oldName) {
            const newName = prompt("Yangi obyekt nomini kiriting:", oldName);
            if (!newName || newName.trim() === "" || newName.trim() === oldName) return;

            try {
                const response = await fetch('/api/objects', {
                    method: 'PUT',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        old_nomi: oldName,
                        new_nomi: newName.trim()
                    })
                });

                if (response.ok) {
                    alert("Obyekt nomi muvaffaqiyatli o'zgartirildi!");
                    loadObjects(); // Ro'yxatni yangilaymiz
                } else {
                    alert("Xatolik yuz berdi!");
                }
            } catch (error) {
                console.error("Obyektni o'zgartirishda xatolik:", error);
            }
        }

        // Xarajat qo'shish
        async function addExpense() {
            const obekt = document.getElementById('objectSelect').value;
            const nomi = document.getElementById('expenseName').value.trim();
            const summa = document.getElementById('expenseAmount').value.trim();

            if (!obekt) return alert("Obyektni tanlang!");
            if (!nomi || !summa) return alert("Xarajat nomi va summasini kiriting!");

            await fetch('/api/expenses', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ obekt: obekt, nomi: nomi, summa: summa })
            });

            document.getElementById('expenseName').value = '';
            document.getElementById('expenseAmount').value = '';
            loadExpenses();
        }

        // Tanlangan obyekt xarajatlarini yuklash
        async function loadExpenses() {
            const obekt = document.getElementById('objectSelect').value;
            const tbody = document.getElementById('expensesTableBody');
            const totalDiv = document.getElementById('totalAmount');

            tbody.innerHTML = '';
            totalDiv.textContent = 'Jami: 0 so\'m';

            if (!obekt) return;

            try {
                const res = await fetch(`/api/expenses_by_param?obekt=${encodeURIComponent(obekt)}`);
                const expenses = await res.json();

                let total = 0;
                expenses.forEach(exp => {
                    const tr = document.createElement('tr');
                    tr.innerHTML = `
                        <td>${exp.nomi}</td>
                        <td>${Number(exp.summa).toLocaleString('uz-UZ')} so'm</td>
                    `;
                    tbody.appendChild(tr);
                    total += Number(exp.summa);
                });

                totalDiv.textContent = `Jami: ${total.toLocaleString('uz-UZ')} so'm`;
            } catch (err) {
                console.error("Xarajatlarni yuklashda xatolik:", err);
            }
        }
    </script>
</body>
</html>
