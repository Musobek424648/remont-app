<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remont Xarajatlari</title>
    <style>
        body { font-family: 'Segoe UI', Arial, sans-serif; margin: 20px; background: #f4f6f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        h2, h3, h4 { color: #333; margin-top: 0; }
        input, button { width: 100%; padding: 12px; margin: 6px 0; box-sizing: border-box; border-radius: 6px; font-size: 15px; }
        input { border: 1px solid #ccc; }
        button { background: #28a745; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:hover { background: #218838; }
        .btn-blue { background: #007bff; }
        .btn-blue:hover { background: #0069d9; }
        .box { border: 1px solid #e1e4e8; padding: 15px; margin-top: 15px; border-radius: 8px; background: #fff; }
        .item { padding: 10px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .total { font-weight: bold; text-align: right; margin-top: 12px; font-size: 18px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏗️ Remont Xarajatlari</h2>

    <!-- Ob'ekt qo'shish -->
    <div class="box">
        <h3>Ob'ekt qo'shish</h3>
        <input type="text" id="objInput" placeholder="Ob'ekt nomi (masalan: Uy remont)">
        <button class="btn-blue" onclick="addObj()">Ob'ektni Saqlash</button>
    </div>

    <!-- Ob'ektlar ro'yxati -->
    <div class="box">
        <h3>Ob'ektlar</h3>
        <div id="objList">Yuklanmoqda...</div>
    </div>

    <!-- Xarajatlar oynasi -->
    <div id="expenseBox" class="box" style="display:none; border: 2px solid #007bff;">
        <h3 id="selectedObjTitle" style="color: #007bff;"></h3>
        
        <input type="text" id="expName" placeholder="Xarajat nomi (masalan: Sement)">
        <input type="number" id="expSum" placeholder="Summasi (so'm)">
        <button onclick="addExp()">+ Xarajat Qo'shish</button>

        <hr style="border: 0; border-top: 1px solid #eee; margin: 15px 0;">
        <h4>Kiritilgan xarajatlar:</h4>
        <div id="expList"></div>
        <div id="totalSum" class="total">Jami: 0 so'm</div>
    </div>
</div>

<script>
    let currentObj = "";

    window.onload = function() {
        loadObjs();
    };

    function loadObjs() {
        fetch('/api/objects')
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById('objList');
                div.innerHTML = "";
                if (!data || data.length === 0) {
                    div.innerHTML = "<p style='color:#777;'>Hali ob'ekt yo'q.</p>";
                    return;
                }
                data.forEach(item => {
                    let safeName = item.nomi.replace(/'/g, "\\'");
                    div.innerHTML += `
                        <div class="item">
                            <span><b>${item.nomi}</b></span>
                            <button class="btn-blue" style="width: auto; padding: 6px 12px;" onclick="selectObj('${safeName}')">Xarajatlar</button>
                        </div>
                    `;
                });
            });
    }

    function addObj() {
        let name = document.getElementById('objInput').value.trim();
        if (!name) return alert("Nom kiriting!");

        fetch('/api/objects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nomi: name})
        })
        .then(res => res.json())
        .then(() => {
            document.getElementById('objInput').value = "";
            loadObjs();
        });
    }

    function selectObj(name) {
        currentObj = name;
        document.getElementById('selectedObjTitle').innerText = "📍 Ob'ekt: " + name;
        document.getElementById('expenseBox').style.display = "block";
        loadExp();
    }

    function loadExp() {
        if (!currentObj) return;
        fetch('/api/expenses_by_param?obekt=' + encodeURIComponent(currentObj))
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById('expList');
                let totalDiv = document.getElementById('totalSum');
                div.innerHTML = "";
                let total = 0;

                if (!data || data.length === 0) {
                    div.innerHTML = "<p style='color: #777;'>Bu ob'ektga hali xarajat kiritilmadi.</p>";
                    totalDiv.innerText = "Jami: 0 so'm";
                    return;
                }

                data.forEach(item => {
                    let s = parseInt(item.summa) || 0;
                    total += s;
                    div.innerHTML += `
                        <div class="item">
                            <span>${item.nomi}</span>
                            <b style="color: #28a745;">${s.toLocaleString('uz-UZ')} so'm</b>
                        </div>
                    `;
                });

                totalDiv.innerText = "Jami: " + total.toLocaleString('uz-UZ') + " so'm";
            });
    }

    function addExp() {
        let name = document.getElementById('expName').value.trim();
        let sum = document.getElementById('expSum').value.trim();

        if (!name || !sum) return alert("Xarajat nomi va summasini kiriting!");

        fetch('/api/expenses', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({obekt: currentObj, nomi: name, summa: sum})
        })
        .then(res => res.json())
        .then(() => {
            document.getElementById('expName').value = "";
            document.getElementById('expSum').value = "";
            loadExp();
        });
    }
</script>

</body>
</html>
