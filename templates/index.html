<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remont Xarajatlari</title>
    <style>
        body { font-family: sans-serif; margin: 20px; background: #f4f4f9; }
        .container { max-width: 500px; margin: auto; background: white; padding: 20px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.2); }
        input, button { width: 100%; padding: 10px; margin: 5px 0; box-sizing: border-box; }
        button { background: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; border-radius: 4px; }
        button:hover { background: #218838; }
        .btn-blue { background: #007bff; }
        .btn-blue:hover { background: #0069d9; }
        .box { border: 1px solid #ccc; padding: 15px; margin-top: 15px; border-radius: 5px; }
        .item { padding: 8px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; }
        .total { font-weight: bold; text-align: right; margin-top: 10px; font-size: 18px; color: #007bff; }
    </style>
</head>
<body>

<div class="container">
    <h2>Remont Xarajatlari</h2>

    <!-- Ob'ekt qo'shish -->
    <div class="box">
        <h3>Ob'ekt qo'shish</h3>
        <input type="text" id="objInput" placeholder="Ob'ekt nomi">
        <button class="btn-blue" onclick="addObj()">Saqlash</button>
    </div>

    <!-- Ob'ektlar ro'yxati -->
    <div class="box">
        <h3>Ob'ektlar</h3>
        <div id="objList"></div>
    </div>

    <!-- Xarajatlar oynasi -->
    <div id="expenseBox" class="box" style="display:none;">
        <h3 id="selectedObjTitle"></h3>
        
        <input type="text" id="expName" placeholder="Xarajat nomi">
        <input type="number" id="expSum" placeholder="Summasi">
        <button onclick="addExp()">Xarajat Qo'shish</button>

        <hr>
        <h4>Xarajatlar ro'yxati:</h4>
        <div id="expList"></div>
        <div id="totalSum" class="total">Jami: 0 so'm</div>
    </div>
</div>

<script>
    let currentObj = "";

    window.onload = function() {
        loadObjs();
    };

    function loadObjs() {
        fetch('/api/objects')
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById('objList');
                div.innerHTML = "";
                data.forEach(item => {
                    div.innerHTML += `
                        <div class="item">
                            <span><b>${item.nomi}</b></span>
                            <button class="btn-blue" style="width: auto; padding: 5px 10px;" onclick="selectObj('${item.nomi}')">Xarajatlar</button>
                        </div>
                    `;
                });
            });
    }

    function addObj() {
        let name = document.getElementById('objInput').value.trim();
        if (!name) return alert("Nom kiriting!");

        fetch('/api/objects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nomi: name})
        })
        .then(res => res.json())
        .then(() => {
            document.getElementById('objInput').value = "";
            loadObjs();
        });
    }

    function selectObj(name) {
        currentObj = name;
        document.getElementById('selectedObjTitle').innerText = "Ob'ekt: " + name;
        document.getElementById('expenseBox').style.display = "block";
        loadExp();
    }

    function loadExp() {
        fetch('/api/expenses_by_param?obekt=' + encodeURIComponent(currentObj))
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById('expList');
                let totalDiv = document.getElementById('totalSum');
                div.innerHTML = "";
                let total = 0;

                data.forEach(item => {
                    let s = parseInt(item.summa) || 0;
                    total += s;
                    div.innerHTML += `
                        <div class="item">
                            <span>${item.nomi}</span>
                            <b>${s} so'm</b>
                        </div>
                    `;
                });

                totalDiv.innerText = "Jami: " + total + " so'm";
            });
    }

    function addExp() {
        let name = document.getElementById('expName').value.trim();
        let sum = document.getElementById('expSum').value.trim();

        if (!name || !sum) return alert("Ma'lumotlarni to'liq kiriting!");

        fetch('/api/expenses', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({obekt: currentObj, nomi: name, summa: sum})
        })
        .then(res => res.json())
        .then(() => {
            document.getElementById('expName').value = "";
            document.getElementById('expSum').value = "";
            loadExp();
        });
    }
</script>

</body>
</html>
