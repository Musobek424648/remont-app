<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remont Xarajatlari</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; padding: 20px; background-color: #f0f2f5; }
        .container { max-width: 600px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        h2 { text-align: center; color: #1a73e8; margin-top: 0; }
        h3, h4 { color: #333; margin-top: 0; }
        input { padding: 12px; margin: 8px 0; width: 100%; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; font-size: 15px; }
        button { padding: 12px; margin: 8px 0; width: 100%; background-color: #28a745; color: white; border: none; font-size: 15px; font-weight: bold; cursor: pointer; border-radius: 6px; transition: 0.2s; }
        button:hover { background-color: #218838; }
        .btn-blue { background-color: #1a73e8; }
        .btn-blue:hover { background-color: #1557b0; }
        .box { border: 1px solid #e0e0e0; padding: 18px; margin-top: 18px; border-radius: 8px; background: #fafafa; }
        .item { padding: 12px; border-bottom: 1px solid #eee; display: flex; justify-content: space-between; align-items: center; background: white; margin-bottom: 6px; border-radius: 4px; }
        .item:last-child { border-bottom: none; }
        .total-box { margin-top: 15px; padding: 15px; background: #e8f0fe; border-radius: 6px; text-align: right; font-weight: bold; font-size: 18px; color: #1967d2; }
        .obj-btn { width: auto; padding: 6px 14px; margin: 0; }
    </style>
</head>
<body>

<div class="container">
    <h2>🏗️ Remont Xarajatlari</h2>

    <!-- Ob'ekt qo'shish -->
    <div class="box">
        <h3>Yangi Ob'ekt Qo'shish</h3>
        <input type="text" id="objInput" placeholder="Ob'ekt nomi (masalan: Yunusobod)">
        <button class="btn-blue" onclick="addObj()">Ob'ektni Saqlash</button>
    </div>

    <!-- Ob'ektlar ro'yxati -->
    <div class="box">
        <h3>Ob'ektlar Ro'yxati</h3>
        <div id="objList">Yuklanmoqda...</div>
    </div>

    <!-- Xarajatlar bloki -->
    <div id="expenseBox" class="box" style="display:none; background: #fff; border: 2px solid #1a73e8;">
        <h3 id="selectedObjTitle" style="color: #1a73e8;"></h3>
        
        <div style="background: #f8f9fa; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #eee;">
            <h4>Yangi xarajat kiritish:</h4>
            <input type="text" id="expName" placeholder="Xarajat nomi (masalan: Sement)">
            <input type="number" id="expSum" placeholder="Summa (so'm)">
            <button onclick="addExp()">+ Xarajatni Saqlash</button>
        </div>

        <h4>Kiritilgan xarajatlar ro'yxati:</h4>
        <div id="expList"></div>
        <div id="totalSum" class="total-box">Jami: 0 so'm</div>
    </div>

    <!-- Excel yuklash -->
    <div class="box" style="text-align: center;">
        <a href="/download/excel" style="text-decoration: none;">
            <button class="btn-blue">📥 Excel Hisobotni Yuklab Olish</button>
        </a>
    </div>
</div>

<script>
    let currentObj = "";

    document.addEventListener("DOMContentLoaded", function() {
        loadObjs();
    });

    function loadObjs() {
        fetch('/api/objects')
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById('objList');
                div.innerHTML = "";
                if(!data || data.length === 0) {
                    div.innerHTML = "<p style='color: #888;'>Hali ob'ektlar qo'shilmadi.</p>";
                    return;
                }
                data.forEach(item => {
                    let name = item.nomi;
                    let d = document.createElement('div');
                    d.className = 'item';
                    d.innerHTML = `<span><b>${name}</b></span>
                                   <button class="btn-blue obj-btn" onclick="selectObj('${name.replace(/'/g, "\\'")}')">Xarajatlar</button>`;
                    div.appendChild(d);
                });
            })
            .catch(err => console.error("Xatolik ob'ektlarni yuklashda:", err));
    }

    function addObj() {
        let nameInput = document.getElementById('objInput');
        let name = nameInput.value.trim();
        if(!name) return alert("Ob'ekt nomini kiriting!");
        
        fetch('/api/objects', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({nomi: name})
        })
        .then(res => res.json())
        .then(() => {
            nameInput.value = "";
            loadObjs();
        });
    }

    function selectObj(name) {
        currentObj = name;
        document.getElementById('selectedObjTitle').innerText = "📍 Ob'ekt: " + name;
        document.getElementById('expenseBox').style.display = "block";
        loadExp();
    }

    function loadExp() {
        if (!currentObj) return;
        fetch('/api/expenses_by_param?obekt=' + encodeURIComponent(currentObj))
            .then(res => res.json())
            .then(data => {
                let div = document.getElementById('expList');
                let totalDiv = document.getElementById('totalSum');
                div.innerHTML = "";
                let total = 0;

                if(!data || data.length === 0) {
                    div.innerHTML = "<p style='color: #888; text-align: center;'>Ushbu ob'ektga hali xarajat kiritilmagan.</p>";
                    totalDiv.innerText = "Jami: 0 so'm";
                    return;
                }

                data.forEach(item => {
                    let sumVal = parseInt(item.summa) || 0;
                    total += sumVal;
                    div.innerHTML += `<div class="item">
                        <span>${item.nomi}</span> 
                        <b style="color: #28a745;">${sumVal.toLocaleString('uz-UZ')} so'm</b>
                    </div>`;
                });

                totalDiv.innerText = "Jami: " + total.toLocaleString('uz-UZ') + " so me";
            })
            .catch(err => console.error("Xatolik xarajatlarni yuklashda:", err));
    }

    function addExp() {
        let nameInput = document.getElementById('expName');
        let sumInput = document.getElementById('expSum');
        let name = nameInput.value.trim();
        let sum = sumInput.value.trim();

        if(!name || !sum) return alert("Xarajat nomi va summasini kiriting!");

        fetch('/api/expenses', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({obekt: currentObj, nomi: name, summa: sum})
        })
        .then(res => res.json())
        .then(() => {
            nameInput.value = "";
            sumInput.value = "";
            loadExp();
        });
    }
</script>

</body>
</html>
